# XcodeGen spec — a backup way to (re)generate the Xcode project.
#
# The repo already ships a ready-to-open BibleStudy.xcodeproj, so you normally
# do NOT need this. Use it only if you'd rather regenerate the project from
# scratch (e.g. after restructuring files):
#
#   brew install xcodegen
#   xcodegen generate
#
name: BibleStudy
options:
  bundleIdPrefix: com.mannasilo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MannaSilo:
    type: application
    platform: iOS
    sources:
      - path: BibleStudy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mannasilo.biblestudy
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: BibleStudy/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Manna Silo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
